<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Qalyn Calculator</title>
</head>
<body>
    <div class="container mt-4 shadow p-3 mb-5 bg-white rounded">
        <div class="row">
            <div class="col col-sm-12">
                <h1 class="text-center">Dowry Calculator</h1>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" class="form-control">
                    <label for="starting_bid">Starting Bid:</label>
                    <input type="number" id="starting_bid" class="form-control">
                    <label for="education">Education level:</label><br>
                    <select id="education" class="form-control">
                        <option value="undergraduate">Undergraduate degree</option>
                        <option value="college">College degree</option>
                        <option value="high_school">High school degree</option>
                        <option value="middle_school">Middle school degree</option>
                    </select>
                    <label for="networth">Family net worth:</label><br>
                    <select id="networth" class="form-control">
                        <option value="upper_class">More than $10,000</option>
                        <option value="middle_class">Between $5,000 and $10,000</option>
                        <option value="lower_class">Less than $5,000</option>
                    </select>
                    <label for="caste">Caste:</label><br>
                    <select id="caste" class="form-control">
                        <option value="brahmin">Brahmin</option>
                        <option value="kshatriya">Kshatriya</option>
                        <option value="vaishya">Vaishya</option>
                        <option value="shudra">Shudra</option>
                        <option value="untouchable">Varna - untouchable</option>
                    </select>
                    <label for="skills">Skills:</label><br>
                    <input type="checkbox" class="skills" value="music"> Playing on a musical instrument<br>
                    <input type="checkbox" class="skills" value="cook"> Good cook<br>
                    <input type="checkbox" class="skills" value="easygoing"> Easygoing character<br>
                    <input type="checkbox" class="skills" value="sings"> Sings well<br>
                    <label for="age">Age:</label><br>
                    <input type="radio" name="age" value="age_18_23"> 18-23<br>
                    <input type="radio" name="age" value="age_24_27"> 24-27<br>
                    <input type="radio" name="age" value="age_28_plus"> 28+<br>
                    <label for="reputation">Reputation:</label><br>
                    <input type="checkbox" class="reputation" value="gossips_parents"> Gossips about parent's attitude<br>
                    <input type="checkbox" class="reputation" value="gossips_character"> Gossips about character<br>
                    <input type="checkbox" class="reputation" value="general_gossips"> General gossips around her person<br>
                    <label for="love_letter">Love Letter:</label>
                    <textarea id="love_letter" maxlength="500" class="form-control"></textarea>
                    <button id="submit" type="button" class="btn btn-primary mt-3">Calculate Price</button>
                </form>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj
